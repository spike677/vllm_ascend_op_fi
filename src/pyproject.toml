[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demoncat-worker-extension"
version = "0.3.0rc7"
description = "DemonCATPFI attachment for an existing vLLM-Ascend worker"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dcatpfi-product = "demoncat.runtime.vllm_ascend.worker_extension.product_cli_entry:main"

[tool.setuptools.packages.find]
include = ["demoncat.runtime*"]
namespaces = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"demoncat.runtime.vllm_ascend.worker_extension" = ["*.json"]
