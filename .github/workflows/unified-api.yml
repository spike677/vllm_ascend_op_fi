name: Unified API conformance
on:
  pull_request:
  push:
    branches: [integration/demoncat-unified-api-v1]
jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . numpy
      - run: python -m demoncat generate --check
      - run: python tests/unified/run_validation.py --out unified-validation.json
      - run: python engineering_closure/engineering_tests/run_validation.py --out original-regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-validation
          path: |
            unified-validation.json
            original-regression.json
